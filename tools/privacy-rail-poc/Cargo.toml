[workspace]
members = ["."]
resolver = "2"

[package]
name = "stealthbridge-privacy-rail-poc"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Isolated Milestone 4 Soroban 28 verification & adapter boundary PoC for StealthBridge privacy rails"

[features]
# Enables the SHA-256-labelled (forgeable) Groth16 setup in `private_pool`.
# Test-only: `cargo test --features forgeable-test-setup`.
forgeable-test-setup = []

[[test]]
name = "adversarial_vectors"
required-features = ["forgeable-test-setup"]

[dependencies]
ark-bn254 = { version = "0.5.0", default-features = false, features = ["curve"] }
ark-ec = { version = "0.5.0", default-features = false }
ark-ff = { version = "0.5.0", default-features = false }
ark-serialize = { version = "0.5.0", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
soroban-poseidon = "28.0.0"
soroban-sdk = { version = "28.0.0", features = ["testutils"] }
ultrahonk_soroban_verifier = "0.1.0"
