[package]
name = "stealthbridge-privacy-verifier"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Soroban BN254 Groth16 privacy proof verifier and append-only NullifierRegistry for StealthBridge"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
soroban-sdk = "=27.0.6"

[dev-dependencies]
soroban-sdk = { version = "=27.0.6", features = ["testutils"] }
ark-bn254 = { version = "0.5.0", default-features = false, features = ["curve"] }
ark-ec = { version = "0.5.0", default-features = false }
ark-ff = { version = "0.5.0", default-features = false }
sha2 = "0.10.9"

[features]
# The pairing smoke-test generator derives its Groth16 setup from public
# SHA-256 labels, so anyone can forge proofs for its key (audit C-2). It only
# builds when this feature is requested explicitly.
forgeable-test-setup = []

[[example]]
name = "pairing_smoke_test_forgeable_key"
path = "examples/pairing_smoke_test_forgeable_key.rs"
required-features = ["forgeable-test-setup"]

[workspace]
resolver = "2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
