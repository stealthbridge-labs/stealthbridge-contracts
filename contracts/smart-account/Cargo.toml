[package]
name = "stealthbridge-smart-account"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Soroban Smart Account with WebAuthn secp256r1 passkeys, Ed25519 signers, session spending policies, and time-locked recovery"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
soroban-sdk = "=27.0.6"

[dev-dependencies]
soroban-sdk = { version = "=27.0.6", features = ["testutils"] }
ed25519-dalek = "2.2.0"
p256 = { version = "0.13.2", features = ["ecdsa"] }
sha2 = "0.10.9"

[workspace]
resolver = "2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
